databases:
  - name: pratham-ice-cream-db
    plan: free

services:
  - type: web
    name: pratham-ice-cream
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Prathamesh.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: pratham-ice-cream-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
