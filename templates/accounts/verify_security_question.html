{% extends "base.html" %}

{% block title %}Security Question{% endblock title %}

{% block content %}

<div class="auth-container">

    <form action="{% url 'accounts:verify_security_question' %}" method="POST" class="glass-form">
        {% csrf_token %}

        <h1 class="auth-title">🛡️ Security Check</h1>

        <div class="input-box">
            <label>{{ question }}</label>
            <input type="text"
                   name="answer"
                   placeholder="Your answer"
                   required
                   autofocus>
        </div>

        <button class="auth-btn" type="submit">
            Verify
        </button>

        <div class="extra">
            <p><a href="{% url 'accounts:login' %}">Back to Login</a></p>
        </div>

    </form>

</div>

{% endblock content %}
