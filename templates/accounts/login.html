{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock title %}

{% block content %}

<div class="auth-container">

    <form action="{% url 'accounts:login' %}" method="POST" class="glass-form">
        {% csrf_token %}

        <h1 class="auth-title">🍦 Sweet Login</h1>

        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <div class="input-box">
            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter username"
                   required
                   autofocus>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>
        </div>

        <button class="auth-btn" type="submit">
            🔐 Login
        </button>

        <div class="extra">
            <p>Don't have an account?
                <a href="{% url 'accounts:register' %}">Register here</a>
            </p>
        </div>

    </form>

</div>

{% endblock content %}
