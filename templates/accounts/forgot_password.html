{% extends "base.html" %}

{% block title %}Forgot Password{% endblock title %}

{% block content %}

<div class="auth-container">

    <form action="{% url 'accounts:forgot_password' %}" method="POST" class="glass-form">
        {% csrf_token %}

        <h1 class="auth-title">🔑 Forgot Password</h1>

        <p class="text-center text-white-50 mb-4">
            Enter your username to answer your security question.
        </p>

        <div class="input-box">
            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter your username"
                   required
                   autofocus>
        </div>

        <button class="auth-btn" type="submit">
            Continue
        </button>

        <div class="extra">
            <p><a href="{% url 'accounts:login' %}">Back to Login</a></p>
        </div>

    </form>

</div>

{% endblock content %}
