{% extends "base.html" %}

{% block title %}Reset Password{% endblock title %}

{% block content %}

<div class="auth-container">

    <form action="{% url 'accounts:reset_password' %}" method="POST" class="glass-form">
        {% csrf_token %}

        <h1 class="auth-title">🔐 Set New Password</h1>

        <div class="input-box">
            <label>New Password</label>
            <input type="password"
                   name="password1"
                   placeholder="Enter new password (min 8 characters)"
                   required
                   autofocus>
        </div>

        <div class="input-box">
            <label>Confirm New Password</label>
            <input type="password"
                   name="password2"
                   placeholder="Confirm new password"
                   required>
        </div>

        <button class="auth-btn" type="submit">
            Save New Password
        </button>

    </form>

</div>

{% endblock content %}
